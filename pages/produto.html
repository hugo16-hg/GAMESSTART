<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GamesStart - Produtos</title>

    <link rel="stylesheet" href="../style/produto.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="container">

        <!-- ================= SIDEBAR ================= -->

        <aside class="sidebar">

            <div class="logo">

                <div class="logo-icon">
                    <i class="fa-solid fa-gamepad"></i>
                </div>

                <div>

                    <h2>GamesStart</h2>

                    <span>PAINEL LOJISTA</span>

                </div>

            </div>

            <nav>

                <ul>

                    <li>
                        <a href="#">
                            <i class="fa-solid fa-chart-line"></i>
                            Dashboard
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <i class="fa-solid fa-cart-shopping"></i>
                            Pedidos
                        </a>
                    </li>

                    <li class="active">
                        <a href="#">
                            <i class="fa-solid fa-box"></i>
                            Produtos
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <i class="fa-solid fa-users"></i>
                            Clientes
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <i class="fa-solid fa-file-lines"></i>
                            Relatórios
                        </a>
                    </li>

                </ul>

            </nav>

            <div class="support-card">

                <p>Suporte Premium</p>

                <button>Falar com Consultor</button>

            </div>

        </aside>

        <!-- ================= CONTEÚDO ================= -->

        <main class="content">

            <!-- HEADER -->

            <header class="header">

                <div class="search-top">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input
                        type="text"
                        placeholder="Buscar pedidos, ID ou cliente...">

                </div>

                <div class="header-right">

                    <button class="icon-btn">

                        <i class="fa-solid fa-bell"></i>

                    </button>

                    <button class="icon-btn">

                        <i class="fa-solid fa-message"></i>

                    </button>

                    <div class="profile">

                        <div>

                            <h4>Ricardo Tech Store</h4>

                            <span>Admin Master</span>

                        </div>

                        <img src="img/avatar.png">

                    </div>

                </div>

            </header>

            <!-- TÍTULO -->

            <section class="page-title">

                <div>

                    <h1>Gestão de Produtos</h1>

                    <p>Gerencie seu catálogo de produtos e estoque</p>

                </div>

                <button id="novoProduto">

                    <i class="fa-solid fa-plus"></i>

                    Adicionar Novo Produto

                </button>

            </section>

            <!-- FILTROS -->

            <section class="filters">

                <div class="search-filter">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input
                        id="pesquisa"
                        type="text"
                        placeholder="Pesquisar por nome ou SKU...">

                </div>

                <select id="categoria">

                    <option value="">Categoria</option>

                </select>

                <select id="status">

                    <option value="">Status</option>

                    <option value="Ativo">Ativo</option>

                    <option value="Inativo">Inativo</option>

                </select>

                <button id="limparFiltros">

                    Limpar Filtros

                </button>

            </section>

            <!-- TABELA -->

            <section class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>IMG</th>

                            <th>PRODUTO</th>

                            <th>CATEGORIA</th>

                            <th>PREÇO</th>

                            <th>ESTOQUE</th>

                            <th>STATUS</th>

                            <th>AÇÕES</th>

                        </tr>

                    </thead>

                    <tbody id="listaProdutos">

                        <!--
                            O JavaScript criará todas
                            as linhas automaticamente.
                        -->

                    </tbody>

                </table>

                <div class="table-footer">

                    <span id="contadorProdutos">

                        Mostrando 0 produtos

                    </span>

                    <div class="pagination" id="pagination">

                        <!-- JS -->

                    </div>

                </div>

            </section>

        </main>

    </div>

    <!-- MODAL -->

    <div class="modal" id="modalProduto">

        <div class="modal-content">

            <h2>Novo Produto</h2>

            <form id="formProduto">

                <input
                    type="text"
                    id="nome"
                    placeholder="Nome do produto"
                    required>

                <input
                    type="text"
                    id="sku"
                    placeholder="SKU"
                    required>

                <input
                    type="text"
                    id="categoriaProduto"
                    placeholder="Categoria"
                    required>

                <input
                    type="number"
                    id="preco"
                    placeholder="Preço"
                    required>

                <input
                    type="number"
                    id="estoque"
                    placeholder="Estoque"
                    required>

                <select id="statusProduto">

                    <option value="Ativo">Ativo</option>

                    <option value="Inativo">Inativo</option>

                </select>

                <input
                    type="text"
                    id="imagem"
                    placeholder="URL da imagem">

                <div class="modal-buttons">

                    <button type="submit">

                        Salvar Produto

                    </button>

                    <button
                        type="button"
                        id="fecharModal">

                        Cancelar

                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="../js/produto.js"></script>

</body>

</html>
