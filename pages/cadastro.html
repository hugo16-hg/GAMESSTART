<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GamesStart | Cadastro</title>

    <link rel="stylesheet" href="../style/cadastro.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <main
        id="paginaCadastro"
        class="pagina-cadastro">

        <!-- ========================================= -->
        <!-- CONTAINER PRINCIPAL -->
        <!-- ========================================= -->

        <section
            id="containerCadastro"
            class="container-cadastro">

            <!-- ========================================= -->
            <!-- LADO ESQUERDO -->
            <!-- ========================================= -->

            <section
                id="painelEsquerdo"
                class="painel-esquerdo">

                <!-- Logo -->

                <header
                    id="cabecalhoEsquerdo"
                    class="cabecalho-esquerdo">

                    <div
                        id="logoContainer"
                        class="logo-container">

                        <i
                            id="iconeLogo"
                            class="fa-solid fa-gamepad"></i>

                        <h1
                            id="nomeSistema"
                            class="nome-sistema">
                        </h1>

                    </div>

                </header>

                <!-- Texto Principal -->

                <section
                    id="conteudoEsquerdo"
                    class="conteudo-esquerdo">

                    <h2
                        id="tituloBoasVindas"
                        class="titulo-boas-vindas">
                    </h2>

                    <p
                        id="descricaoBoasVindas"
                        class="descricao-boas-vindas">
                    </p>

                </section>

                <!-- Marca d'água -->

                <div
                    id="marcaDagua"
                    class="marca-dagua">

                </div>

                <!-- Rodapé -->

                <footer
                    id="rodapeEsquerdo"
                    class="rodape-esquerdo">

                    <!-- Segurança -->

                    <article
                        id="cardSeguranca"
                        class="card-info">

                        <div
                            id="iconeSeguranca"
                            class="icone-card">

                            <i class="fa-solid fa-shield-halved"></i>

                        </div>

                        <div
                            id="textoSeguranca"
                            class="texto-card">

                            <h3
                                id="tituloSeguranca"
                                class="titulo-card">
                            </h3>

                            <p
                                id="descricaoSeguranca"
                                class="descricao-card">
                            </p>

                        </div>

                    </article>

                    <!-- Rapidez -->

                    <article
                        id="cardRapidez"
                        class="card-info">

                        <div
                            id="iconeRapidez"
                            class="icone-card">

                            <i class="fa-solid fa-bolt"></i>

                        </div>

                        <div
                            id="textoRapidez"
                            class="texto-card">

                            <h3
                                id="tituloRapidez"
                                class="titulo-card">
                            </h3>

                            <p
                                id="descricaoRapidez"
                                class="descricao-card">
                            </p>

                        </div>

                    </article>

                </footer>

            </section>

            <!-- ========================================= -->
            <!-- LADO DIREITO -->
            <!-- ========================================= -->

            <section
                id="painelDireito"
                class="painel-direito">

                <header
                    id="cabecalhoFormulario"
                    class="cabecalho-formulario">

                    <h2
                        id="tituloCadastro"
                        class="titulo-cadastro">
                    </h2>

                    <p
                        id="subtituloCadastro"
                        class="subtitulo-cadastro">
                    </p>

                </header>

                <!-- FORMULÁRIO -->

                <form
                    id="formCadastro"
                    class="form-cadastro">

                    <!-- Nome -->

                    <div
                        id="grupoNome"
                        class="grupo-campo">

                        <label
                            id="labelNome"
                            class="label-campo"
                            for="inputNome">
                        </label>

                        <div
                            id="containerNome"
                            class="container-input">

                            <i class="fa-solid fa-user"></i>

                            <input
                                id="inputNome"
                                class="input-campo"
                                type="text">

                        </div>

                    </div>

                    <!-- Email e Telefone -->

                    <section
                        id="linhaContato"
                        class="linha-dupla">

                        <div
                            id="grupoEmail"
                            class="grupo-campo">

                            <label
                                id="labelEmail"
                                class="label-campo"
                                for="inputEmail">
                            </label>

                            <div
                                id="containerEmail"
                                class="container-input">

                                <i class="fa-solid fa-envelope"></i>

                                <input
                                    id="inputEmail"
                                    class="input-campo"
                                    type="email">

                            </div>

                        </div>

                        <div
                            id="grupoTelefone"
                            class="grupo-campo">

                            <label
                                id="labelTelefone"
                                class="label-campo"
                                for="inputTelefone">
                            </label>

                            <div
                                id="containerTelefone"
                                class="container-input">

                                <i class="fa-solid fa-phone"></i>

                                <input
                                    id="inputTelefone"
                                    class="input-campo"
                                    type="text">

                            </div>

                        </div>

                    </section>

                    <!-- CPF -->

                    <div
                        id="grupoCpf"
                        class="grupo-campo">

                        <label
                            id="labelCpf"
                            class="label-campo"
                            for="inputCpf">
                        </label>

                        <div
                            id="containerCpf"
                            class="container-input">

                            <i class="fa-solid fa-id-card"></i>

                            <input
                                id="inputCpf"
                                class="input-campo"
                                type="text">

                        </div>

                    </div>
                 
                        
                  <!-- Data de Nascimento -->

            <div
                             id="grupoDataNascimento"
                                    class="grupo-campo">

                                <label
                                   id="labelDataNascimento"
                                       class="label-campo"
                                 for="inputDataNascimento">
                               </label>

                    <div
                           id="containerDataNascimento"
                              class="container-input">

                            <i class="fa-solid fa-calendar-days"></i>

                        <input
                                id="inputDataNascimento"
                                class="input-campo"
                                  type="text"
                                 maxlength="10">

          </div>

</div>
                    <!-- Senhas -->

                    <section
                        id="linhaSenha"
                        class="linha-dupla">

                        <div
                            id="grupoSenha"
                            class="grupo-campo">

                            <label
                                id="labelSenha"
                                class="label-campo"
                                for="inputSenha">
                            </label>

                           <div class="container-input senha-group">

    <i class="fas fa-lock"></i>

    <input
        type="password"
        id="senha"
        class="input-campo"
        placeholder="Digite sua senha"
    >

    <button
        type="button"
        class="toggle-password"
        onclick="mostrarSenha('senha', this)">

        <i class="fas fa-eye"></i>

    </button>

</div>

                        </div>
                        

                        <div
                            id="grupoConfirmarSenha"
                            class="grupo-campo">

                            <label
                                id="labelConfirmarSenha"
                                class="label-campo"
                                for="inputConfirmarSenha">
                            </label>

                          <div class="container-input senha-group">

    <i class="fas fa-lock"></i>

    <input
        type="password"
        id="confirmarSenha"
        class="input-campo"
        placeholder="Confirme sua senha"
    >

    <button
        type="button"
        class="toggle-password"
        onclick="mostrarSenha('confirmarSenha', this)">

        <i class="fas fa-eye"></i>

    </button>

</div>

                        </div>

                    </section>

                    <!-- Termos -->

                    <div
                        id="grupoTermos"
                        class="grupo-termos">

                        <input
                            id="checkTermos"
                            class="check-termos"
                            type="checkbox">

                        <label
                            id="textoTermos"
                            class="texto-termos"
                            for="checkTermos">
                        </label>

                    </div>
                        
                    <p id="mensagem"></p>
                    <!-- Botão -->

                    <button
                        id="btnCadastrar"
                        class="btn-cadastrar"
                        type="button">
                    </button>

                </form>

                <!-- Login -->

                <section
                    id="loginContainer"
                    class="login-container">

                    <p
                        id="textoLogin"
                        class="texto-login">
                    </p>

                    <a
                        id="linkLogin"
                        class="link-login"
                        href="login.html">
                    </a>

                </section>

                <!-- Separador -->

                <section
                    id="separador"
                    class="separador">

                    <div class="linha"></div>

                    <span
                        id="textoSeparador"
                        class="texto-separador">
                    </span>

                    <div class="linha"></div>

                </section>

                <!-- Redes -->

                <section
                    id="loginSocial"
                    class="login-social">

                    <button
                        id="btnGoogle"
                        class="btn-social"
                        type="button">

                        <i class="fa-brands fa-google"></i>

                        <span
                            id="textoGoogle"
                            class="texto-social">
                        </span>

                    </button>

                    <button
                        id="btnApple"
                        class="btn-social"
                        type="button">

                        <i class="fa-brands fa-apple"></i>

                        <span
                            id="textoApple"
                            class="texto-social">
                        </span>

                    </button>

                </section>

            </section>

        </section>

    </main>

    <script src="../js/cadastro.js"></script>

</body>

</html>
