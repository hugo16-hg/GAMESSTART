<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GamesStart</title>

    <link rel="stylesheet" href="../style/detalhe_produto.css">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>
    <header class="header" id="header"></header>

    <main>
        <nav
            class="breadcrumb"
            id="breadcrumb"
            aria-label="Navegação estrutural"
        ></nav>

        <section
            class="product-details"
            id="productDetails"
            aria-label="Detalhes do produto"
        >
            <div class="product-gallery">
                <div
                    class="product-thumbnails"
                    id="productThumbnails"
                    aria-label="Galeria de imagens do produto"
                ></div>

                <div
                    class="main-product-image"
                    id="mainProductImage"
                ></div>
            </div>

            <article
                class="product-summary"
                id="productSummary"
            ></article>
        </section>

        <section
            class="description"
            id="productDescription"
            aria-labelledby="descriptionTitle"
        >
            <h2 id="descriptionTitle"></h2>

            <div
                class="description-content"
                id="descriptionContent"
            ></div>
        </section>

        <section
            class="comments"
            id="productComments"
            aria-labelledby="commentsTitle"
        >
            <div class="comments-header">
                <h2 id="commentsTitle"></h2>

                <span
                    class="comments-count"
                    id="commentsCount"
                ></span>
            </div>

            <div
                class="comments-summary"
                id="commentsSummary"
            ></div>

            <form
                class="comment-form"
                id="commentForm"
            ></form>

            <div
                class="comments-list-header"
                id="commentsListHeader"
            ></div>

            <div
                class="comments-list"
                id="commentsList"
            ></div>
        </section>

        <section
            class="recommendations"
            id="recommendations"
            aria-labelledby="recommendationsTitle"
        >
            <div class="recommendations-header">
                <h2 id="recommendationsTitle"></h2>

                <div
                    class="recommendation-controls"
                    id="recommendationControls"
                ></div>
            </div>

            <div
                class="recommendations-grid"
                id="recommendationsGrid"
            ></div>
        </section>
    </main>

    <footer class="footer" id="footer"></footer>

    <script src="../js/detalhe_produto.js"></script>
</body>
</html>
