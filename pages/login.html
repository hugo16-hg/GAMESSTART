<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="../style/login.css">

</head>


<body>


    <div id="app">


        <!-- ==========================================
             CABEÇALHO
        ========================================== -->

        <header id="header">

        </header>



        <!-- ==========================================
             CONTEÚDO PRINCIPAL
        ========================================== -->

        <main id="main">


            <section id="loginSection">


                <div id="loginCard">


                    <!-- TÍTULO -->

                    <h1 id="loginTitle"></h1>


                    <!-- SUBTÍTULO -->

                    <p id="loginSubtitle"></p>



                    <!-- ==========================================
                         FORMULÁRIO
                    ========================================== -->

                    <form id="loginForm">


                        <!-- ==========================================
                             EMAIL
                        ========================================== -->

                        <div id="emailGroup">


                            <label id="emailLabel" for="email">
                            </label>


                            <div id="emailInputArea">


                                <span id="emailIcon"></span>


                                <input id="email" type="email" autocomplete="email">


                            </div>


                        </div>



                        <!-- ==========================================
                             SENHA
                        ========================================== -->

                        <div id="passwordGroup">


                            <div id="passwordHeader">


                                <label id="passwordLabel" for="password">
                                </label>


                                <a id="forgotPassword" href="#">
                                </a>


                            </div>



                            <div id="passwordInputArea">


                                <img id="passwordIcon" src="/assets/cadeado.png" alt="Senha">


                                <input id="password" type="password" autocomplete="current-password">


                                <!-- Mostrar / ocultar senha -->

                                <button id="showPassword" type="button">

                                    <img id="eyeIcon" src="/assets/esconder.png" alt="Mostrar senha">

                                </button>


                            </div>


                        </div>



                        <!-- ==========================================
                             LEMBRAR
                        ========================================== -->

                        <div id="rememberArea">


                            <input id="remember" type="checkbox">


                            <label id="rememberLabel" for="remember">
                            </label>


                        </div>



                        <!-- ==========================================
                             MENSAGEM
                        ========================================== -->

                        <p id="mensagem"></p>



                        <!-- ==========================================
                             BOTÃO LOGIN
                        ========================================== -->

                        <button id="loginButton" type="submit">
                        </button>


                    </form>



                    <!-- ==========================================
                         DIVISOR
                    ========================================== -->

                    <div id="divider">

                        <span id="dividerText"></span>

                    </div>



                    <!-- ==========================================
                         GOOGLE
                    ========================================== -->

                    <button id="googleButton" type="button">


                        <img id="googleIcon" src="/assets/google.png" alt="Google">


                        <span id="googleText"></span>


                    </button>



                    <!-- ==========================================
                         CADASTRO
                    ========================================== -->

                    <div id="registerArea">


                        <span id="registerText"></span>


                        <a id="registerLink" href="#">
                        </a>


                    </div>


                </div>


            </section>


        </main>



        <!-- ==========================================
             RODAPÉ
        ========================================== -->

        <footer id="footer">

            <p id="footerText"></p>

        </footer>


    </div>



    <!-- ==========================================
         JAVASCRIPT
    ========================================== -->

    <script src="../js/login.js"></script>


</body>

</html>
