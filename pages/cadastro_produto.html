<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GamesStart - Painel Lojista</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <link rel="stylesheet" href="../style/cadastro_produto.css">
</head>

<body>

    <div class="app-layout">

        <!-- ==================================================
             SIDEBAR
        ================================================== -->

        <aside class="sidebar" id="sidebar">

            <div class="brand">

                <div class="brand-icon">
                    <i class="fa-solid fa-gamepad"></i>
                </div>

                <div class="brand-text">
                    <h1>GamesStart</h1>
                    <span>PAINEL LOJISTA</span>
                </div>

                <button class="btn-close-menu" id="closeMenu">
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>


            <nav class="main-nav">
                <ul id="menuList">
                </ul>
            </nav>


            <div class="sidebar-footer">

                <button class="btn-config">
                    <i class="fa-solid fa-gear"></i>
                    Configurações
                </button>

                <div class="support-card">
                    <span class="support-title">
                        Suporte Premium
                    </span>

                    <button class="btn-support">
                        Falar com Consultor
                    </button>
                </div>

            </div>

        </aside>


        <!-- ==================================================
             CONTEÚDO PRINCIPAL
        ================================================== -->

        <main class="main-content">

            <!-- TOPBAR -->

            <header class="topbar">

                <div class="mobile-toggle">
                    <button id="openMenu" class="icon-button">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                </div>


                <div class="global-search">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input
                        type="text"
                        placeholder="Buscar pedidos, ID ou cliente..."
                    >

                </div>


                <div
                    class="user-actions"
                    id="userActionsContainer">
                </div>

            </header>


            <!-- ==================================================
                 CABEÇALHO DA PÁGINA
            ================================================== -->

            <section class="page-header">

                <div class="page-title">

                    <h2>Gestão de Produtos</h2>

                    <p>
                        Gerencie seu catálogo de produtos e estoque
                    </p>

                </div>


                <div class="page-actions">

                    <button
                        class="btn-primary"
                        id="abrirModalProduto"
                    >
                        <i class="fa-solid fa-plus"></i>
                        Adicionar Novo Produto
                    </button>


                    <button
                        class="btn-primary"
                        id="abrirModalCategoria"
                    >
                        <i class="fa-solid fa-plus"></i>
                        Adicionar Nova Categoria
                    </button>

                </div>

            </section>


            <!-- ==================================================
                 TABELA DE PRODUTOS
            ================================================== -->

            <div class="content-card">

                <div class="table-filters">

                    <div class="search-input">

                        <i class="fa-solid fa-magnifying-glass"></i>

                        <input
                            type="text"
                            id="filterSearch"
                            placeholder="Pesquisar por nome ou SKU..."
                        >

                    </div>


                    <select
                        class="filter-select"
                        id="filterCategory"
                    >
                        <option value="">
                            Categoria
                        </option>
                    </select>


                    <select
                        class="filter-select"
                        id="filterStatus"
                    >
                        <option value="">
                            Status
                        </option>

                        <option value="Ativo">
                            Ativo
                        </option>

                        <option value="Inativo">
                            Inativo
                        </option>
                    </select>


                    <button
                        class="btn-clear"
                        id="btnClearFilters"
                    >
                        Limpar Filtros
                    </button>

                </div>


                <!-- TABELA -->

                <div class="table-responsive">

                    <table class="data-table">

                        <thead>

                            <tr>

                                <th>IMG</th>
                                <th>PRODUTO</th>
                                <th>CATEGORIA</th>
                                <th>PREÇO</th>
                                <th>ESTOQUE</th>
                                <th>STATUS</th>
                                <th>AÇÕES</th>

                            </tr>

                        </thead>


                        <tbody id="tableBody">
                        </tbody>

                    </table>

                </div>


                <!-- PAGINAÇÃO -->

                <div class="table-footer">

                    <span
                        class="pagination-info"
                        id="paginationInfo"
                    >
                        Mostrando
                        <strong>0</strong>
                        produtos
                    </span>


                    <div
                        class="pagination"
                        id="paginationContainer"
                    >
                    </div>

                </div>

            </div>

        </main>

    </div>


    <!-- ==========================================================
         MODAL - NOVO / EDITAR PRODUTO
    =========================================================== -->

    <div
        class="modal-overlay"
        id="modalProduto"
    >

        <div class="modal-content">

            <h3
                class="modal-title"
                id="modalProdutoTitulo"
            >
                Novo Produto
            </h3>


            <form id="formProduto">

                <!-- ID usado para edição -->
                <input
                    type="hidden"
                    id="prodIdEdit"
                >


                <!-- NOME -->

                <div class="input-group">

                    <label for="prodNome">
                        Nome do Produto
                    </label>

                    <input
                        type="text"
                        id="prodNome"
                        placeholder="Ex: PlayStation 5 Console"
                        required
                    >

                </div>


                <!-- SKU -->

                <div class="input-group">

                    <label for="prodSku">
                        SKU
                    </label>

                    <input
                        type="text"
                        id="prodSku"
                        placeholder="Ex: PS5-CONSOLE"
                        required
                    >

                </div>


                <!-- DESCRIÇÃO -->

                <div class="input-group">

                    <label for="prodDescricao">
                        Descrição do Produto
                    </label>

                    <textarea
                        id="prodDescricao"
                        placeholder="Digite uma descrição para o produto..."
                        rows="4"
                        required
                    ></textarea>

                </div>


                <!-- CATEGORIA -->

                <div class="input-group">

                    <label for="prodCategoria">
                        Categoria
                    </label>

                    <select
                        id="prodCategoria"
                        required
                    >

                        <option value="">
                            Selecione uma categoria
                        </option>

                    </select>

                </div>


                <!-- PREÇOS -->

                <div class="input-row">

                    <div class="input-group">

                        <label for="prodPrecoOriginal">
                            Preço Original (R$)
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            id="prodPrecoOriginal"
                            placeholder="0.00"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="prodPrecoPromocional">
                            Preço Promocional (R$)
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            id="prodPrecoPromocional"
                            placeholder="0.00"
                        >

                    </div>

                </div>


                <!-- ESTOQUE E STATUS -->

                <div class="input-row">

                    <div class="input-group">

                        <label for="prodEstoque">
                            Estoque
                        </label>

                        <input
                            type="number"
                            id="prodEstoque"
                            placeholder="0"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="prodStatus">
                            Status
                        </label>

                        <select id="prodStatus">

                            <option value="Ativo">
                                Ativo
                            </option>

                            <option value="Inativo">
                                Inativo
                            </option>

                        </select>

                    </div>

                </div>


                <!-- IMAGEM DO PRODUTO -->

                <div class="input-group">

                    <label for="prodImagem">
                        URL da Imagem
                    </label>

                    <input
                        type="url"
                        id="prodImagem"
                        placeholder="https://exemplo.com/imagem.png"
                        required
                    >

                </div>


                <!-- BOTÕES -->

                <div class="modal-actions">

                    <button
                        type="button"
                        class="btn-cancel"
                        id="fecharModalProduto"
                    >
                        Cancelar
                    </button>


                    <button
                        type="submit"
                        class="btn-save"
                        id="btnSalvarProduto"
                    >
                        Salvar Produto
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- ==========================================================
         MODAL - NOVA CATEGORIA
    =========================================================== -->

    <div
        class="modal-overlay"
        id="modalCategoria"
    >

        <div class="modal-content">

            <h3 class="modal-title">
                Nova Categoria
            </h3>


            <form id="formCategoria">


                <!-- NOME DA CATEGORIA -->

                <div class="input-group">

                    <label for="catNome">
                        Nome da Categoria
                    </label>

                    <input
                        type="text"
                        id="catNome"
                        placeholder="Ex: Acessórios"
                        required
                    >

                </div>


                <!-- IMAGEM DA CATEGORIA -->

                <div class="input-group">

                    <label for="catImagem">
                        URL da Imagem da Categoria
                    </label>

                    <input
                        type="url"
                        id="catImagem"
                        placeholder="https://exemplo.com/icone.png"
                        required
                    >

                </div>


                <!-- BOTÕES -->

                <div class="modal-actions">

                    <button
                        type="button"
                        class="btn-cancel"
                        id="fecharModalCategoria"
                    >
                        Cancelar
                    </button>


                    <button
                        type="submit"
                        class="btn-save"
                        id="btnSalvarCategoria"
                    >
                        Salvar Categoria
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- ==========================================================
         JAVASCRIPT
    =========================================================== -->

    <script src="../js/cadastro_produto.js"></script>

</body>

</html>
