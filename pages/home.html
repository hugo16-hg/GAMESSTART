<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- ==========================================================
        Projeto : GamesStart
        Página  : Home
        Descrição:
        Estrutura da Home.

        Todo o conteúdo será criado pelo arquivo home.js.

        O CSS utilizará apenas classes.

        O JavaScript utilizará apenas IDs.
    =========================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>GamesStart</title>

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="../style/home.css">

    <!-- Fonte -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Ícones -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <!-- ==========================================================
                            HEADER
    =========================================================== -->

    <header
        id="header"
        class="header">

        <!-- Barra Superior -->

        <div
            id="headerSuperior"
            class="header-superior">

            <div
                id="logoContainer"
                class="logo-container">
            </div>

            <div
                id="pesquisaContainer"
                class="pesquisa-container">
            </div>

            <div
                id="acoesContainer"
                class="acoes-container">
            </div>

        </div>

        <!-- Barra Inferior -->

        <div
            id="headerInferior"
            class="header-inferior">

            <nav
                id="menuContainer"
                class="menu-container">
            </nav>

        </div>

    </header>



    <!-- ==========================================================
                            CONTEÚDO
    =========================================================== -->

    <main
        id="main"
        class="main">

        <!-- Banner Principal -->

        <section
            id="bannerPrincipal"
            class="banner-principal">
        </section>



        <!-- Benefícios -->

        <section
            id="beneficios"
            class="beneficios">
        </section>



        <!-- Categorias -->

        <section
            id="categorias"
            class="categorias">

            <header
                id="cabecalhoCategorias"
                class="cabecalho-secao">
            </header>

            <div
                id="listaCategorias"
                class="lista-categorias">
            </div>

        </section>



        <!-- Banner Promoção -->

        <section
            id="bannerPromocional"
            class="banner-promocional">
        </section>



        <!-- Mais Vendidos -->

        <section
            id="maisVendidos"
            class="produtos">

            <header
                id="cabecalhoMaisVendidos"
                class="cabecalho-secao">
            </header>

            <div
                id="listaMaisVendidos"
                class="lista-produtos">
            </div>

        </section>



        <!-- Novidades -->

        <section
            id="novidades"
            class="produtos">

            <header
                id="cabecalhoNovidades"
                class="cabecalho-secao">
            </header>

            <div
                id="listaNovidades"
                class="lista-produtos">
            </div>

        </section>

    </main>



    <!-- ==========================================================
                            FOOTER
    =========================================================== -->

    <footer
        id="footer"
        class="footer">

        <div
            id="footerContainer"
            class="footer-container">

            <section
                id="footerEmpresa"
                class="footer-empresa">
            </section>

            <section
                id="footerInstitucional"
                class="footer-institucional">
            </section>

            <section
                id="footerAtendimento"
                class="footer-atendimento">
            </section>

            <section
                id="footerRedesSociais"
                class="footer-redes">
            </section>

        </div>

        <div
            id="footerCopyright"
            class="footer-copyright">
        </div>

    </footer>

    <!-- ==========================================================
                            JAVASCRIPT
    =========================================================== -->

    <script src="../js/home.js"></script>

</body>

</html>
