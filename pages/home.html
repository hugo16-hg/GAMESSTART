<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GamesStart - Home</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../style/home.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body id="bodyHome" class="body-home">

    <!-- ==========================================================
         HEADER
    =========================================================== -->

    <header
        id="headerHome"
        class="header-home">

        <div
            id="containerHeader"
            class="container-header">

            <!-- ==========================
                 LOGO
            =========================== -->

            <div
                id="areaLogo"
                class="area-logo">

                <a
                    id="linkLogo"
                    class="link-logo"
                    href="../index.html">

                    <img
                        id="imagemLogo"
                        class="imagem-logo"
                        src="../assets/img/logo.png"
                        alt="GamesStart">

                    <span
                        id="textoLogo"
                        class="texto-logo">
                    </span>

                </a>

            </div>

            <!-- ==========================
                 PESQUISA
            =========================== -->

            <div
                id="areaPesquisa"
                class="area-pesquisa">

                <input
                    id="inputPesquisa"
                    class="input-pesquisa"
                    type="text"
                    placeholder="">

                <button
                    id="botaoPesquisar"
                    class="botao-pesquisar">

                    <i class="fa-solid fa-magnifying-glass"></i>

                </button>

            </div>

            <!-- ==========================
                 MENU
            =========================== -->

            <nav
                id="menuPrincipal"
                class="menu-principal">

                <ul
                    id="listaMenu"
                    class="lista-menu">

                    <li
                        id="itemMenuHome"
                        class="item-menu">

                        <a
                            id="linkHome"
                            class="link-menu"
                            href="#">
                        </a>

                    </li>

                    <li
                        id="itemMenuConsoles"
                        class="item-menu">

                        <a
                            id="linkConsoles"
                            class="link-menu"
                            href="#">
                        </a>

                    </li>

                    <li
                        id="itemMenuPC"
                        class="item-menu">

                        <a
                            id="linkPC"
                            class="link-menu"
                            href="#">
                        </a>

                    </li>

                    <li
                        id="itemMenuPerifericos"
                        class="item-menu">

                        <a
                            id="linkPerifericos"
                            class="link-menu"
                            href="#">
                        </a>

                    </li>

                    <li
                        id="itemMenuJogos"
                        class="item-menu">

                        <a
                            id="linkJogos"
                            class="link-menu"
                            href="#">
                        </a>

                    </li>

                    <li
                        id="itemMenuPromocoes"
                        class="item-menu">

                        <a
                            id="linkPromocoes"
                            class="link-menu"
                            href="#">
                        </a>

                    </li>

                </ul>

            </nav>

            <!-- ==========================
                 AÇÕES
            =========================== -->

            <div
                id="areaAcoes"
                class="area-acoes">

                <button
                    id="botaoNotificacao"
                    class="botao-icone">

                    <i class="fa-regular fa-bell"></i>

                </button>

                <button
                    id="botaoCarrinho"
                    class="botao-icone">

                    <i class="fa-solid fa-cart-shopping"></i>

                </button>

                <div
                    id="areaUsuario"
                    class="area-usuario">

                    <img
                        id="imagemUsuario"
                        class="imagem-usuario"
                        src=""
                        alt="Usuário">

                    <div
                        id="dadosUsuario"
                        class="dados-usuario">

                        <span
                            id="nomeUsuario"
                            class="nome-usuario">
                        </span>

                        <span
                            id="tipoUsuario"
                            class="tipo-usuario">
                        </span>

                    </div>

                </div>

            </div>

        </div>

    </header>

    <!-- ==========================================================
         MAIN
    =========================================================== -->

    <main
        id="mainHome"
        class="main-home">

        <!-- ======================================================
             BANNER PRINCIPAL
        ======================================================= -->

        <section
            id="secaoBanner"
            class="secao-banner">

            <div
                id="containerBanner"
                class="container-banner">

                <div
                    id="conteudoBanner"
                    class="conteudo-banner">

                    <span
                        id="subtituloBanner"
                        class="subtitulo-banner">
                    </span>

                    <h1
                        id="tituloBanner"
                        class="titulo-banner">
                    </h1>

                    <p
                        id="descricaoBanner"
                        class="descricao-banner">
                    </p>

                    <div
                        id="botoesBanner"
                        class="botoes-banner">

                        <button
                            id="botaoBannerPrimario"
                            class="botao-banner botao-banner-primario">
                        </button>

                        <button
                            id="botaoBannerSecundario"
                            class="botao-banner botao-banner-secundario">
                        </button>

                    </div>

                </div>

                <div
                    id="imagemBannerContainer"
                    class="imagem-banner-container">

                    <img
                        id="imagemBanner"
                        class="imagem-banner"
                        src=""
                        alt="Banner">

                </div>

            </div>

        </section>        <!-- ======================================================
             BENEFÍCIOS
        ======================================================= -->

        <section
            id="secaoBeneficios"
            class="secao-beneficios">

            <div
                id="containerBeneficios"
                class="container-beneficios">

                <div
                    id="beneficioFrete"
                    class="card-beneficio">

                    <div
                        id="iconeFrete"
                        class="icone-beneficio">

                        <i class="fa-solid fa-truck-fast"></i>

                    </div>

                    <div
                        id="textoFrete"
                        class="texto-beneficio">

                        <h3
                            id="tituloFrete"
                            class="titulo-beneficio">
                        </h3>

                        <p
                            id="descricaoFrete"
                            class="descricao-beneficio">
                        </p>

                    </div>

                </div>

                <div
                    id="beneficioParcelamento"
                    class="card-beneficio">

                    <div
                        id="iconeParcelamento"
                        class="icone-beneficio">

                        <i class="fa-regular fa-credit-card"></i>

                    </div>

                    <div
                        id="textoParcelamento"
                        class="texto-beneficio">

                        <h3
                            id="tituloParcelamento"
                            class="titulo-beneficio">
                        </h3>

                        <p
                            id="descricaoParcelamento"
                            class="descricao-beneficio">
                        </p>

                    </div>

                </div>

                <div
                    id="beneficioGarantia"
                    class="card-beneficio">

                    <div
                        id="iconeGarantia"
                        class="icone-beneficio">

                        <i class="fa-solid fa-shield-halved"></i>

                    </div>

                    <div
                        id="textoGarantia"
                        class="texto-beneficio">

                        <h3
                            id="tituloGarantia"
                            class="titulo-beneficio">
                        </h3>

                        <p
                            id="descricaoGarantia"
                            class="descricao-beneficio">
                        </p>

                    </div>

                </div>

            </div>

        </section>

        <!-- ======================================================
             CATEGORIAS
        ======================================================= -->

        <section
            id="secaoCategorias"
            class="secao-categorias">

            <div
                id="containerCategoriasPrincipal"
                class="container-categorias-principal">

                <div
                    id="cabecalhoCategorias"
                    class="cabecalho-categorias">

                    <div
                        id="tituloCategoriasContainer"
                        class="titulo-categorias-container">

                        <h2
                            id="tituloCategorias"
                            class="titulo-categorias">
                        </h2>

                    </div>

                    <div
                        id="acoesCategorias"
                        class="acoes-categorias">

                        <a
                            id="linkVerTodasCategorias"
                            class="link-ver-todas"
                            href="#">
                        </a>

                    </div>

                </div>

                <div
                    id="containerCategorias"
                    class="container-categorias">

                    <!--
                        Os cards de categorias
                        serão criados pelo JavaScript.
                    -->

                </div>

            </div>

        </section>

        <!-- ======================================================
             BANNER PROMOCIONAL
        ======================================================= -->

        <section
            id="secaoOferta"
            class="secao-oferta">

            <div
                id="containerOferta"
                class="container-oferta">

                <div
                    id="conteudoOferta"
                    class="conteudo-oferta">

                    <span
                        id="subtituloOferta"
                        class="subtitulo-oferta">
                    </span>

                    <h2
                        id="tituloOferta"
                        class="titulo-oferta">
                    </h2>

                    <p
                        id="descricaoOferta"
                        class="descricao-oferta">
                    </p>

                    <button
                        id="botaoOferta"
                        class="botao-oferta">
                    </button>

                    <div
                        id="contadorOferta"
                        class="contador-oferta">

                        <span
                            id="textoContadorOferta"
                            class="texto-contador-oferta">
                        </span>

                    </div>

                </div>

                <div
                    id="imagemOfertaContainer"
                    class="imagem-oferta-container">

                    <img
                        id="imagemOferta"
                        class="imagem-oferta"
                        src=""
                        alt="Oferta">

                </div>

            </div>

        </section>        <!-- ======================================================
             MAIS VENDIDOS
        ======================================================= -->

        <section
            id="secaoMaisVendidos"
            class="secao-mais-vendidos">

            <div
                id="containerMaisVendidosPrincipal"
                class="container-produtos-principal">

                <div
                    id="cabecalhoMaisVendidos"
                    class="cabecalho-produtos">

                    <div
                        id="tituloMaisVendidosContainer"
                        class="titulo-produtos-container">

                        <h2
                            id="tituloMaisVendidos"
                            class="titulo-produtos">
                        </h2>

                        <p
                            id="descricaoMaisVendidos"
                            class="descricao-produtos">
                        </p>

                    </div>

                </div>

                <div
                    id="containerMaisVendidos"
                    class="container-produtos">

                    <!-- Cards criados pelo JavaScript -->

                </div>

            </div>

        </section>

        <!-- ======================================================
             NOVIDADES
        ======================================================= -->

        <section
            id="secaoNovidades"
            class="secao-novidades">

            <div
                id="containerNovidadesPrincipal"
                class="container-produtos-principal">

                <div
                    id="cabecalhoNovidades"
                    class="cabecalho-produtos">

                    <div
                        id="tituloNovidadesContainer"
                        class="titulo-produtos-container">

                        <h2
                            id="tituloNovidades"
                            class="titulo-produtos">
                        </h2>

                        <p
                            id="descricaoNovidades"
                            class="descricao-produtos">
                        </p>

                    </div>

                </div>

                <div
                    id="containerNovidades"
                    class="container-produtos">

                    <!-- Cards criados pelo JavaScript -->

                </div>

            </div>

        </section>

    </main>

    <!-- ==========================================================
         FOOTER
    =========================================================== -->

    <footer
        id="footerHome"
        class="footer-home">

        <div
            id="containerFooter"
            class="container-footer">

            <!-- ==========================================
                 LOGO
            =========================================== -->

            <div
                id="colunaLogoFooter"
                class="coluna-footer">

                <div
                    id="logoFooter"
                    class="logo-footer">

                    <img
                        id="imagemLogoFooter"
                        class="imagem-logo-footer"
                        src="../assets/img/logo.png"
                        alt="GamesStart">

                    <span
                        id="textoLogoFooter"
                        class="texto-logo-footer">
                    </span>

                </div>

                <p
                    id="descricaoFooter"
                    class="descricao-footer">
                </p>

                <div
                    id="redesSociais"
                    class="redes-sociais">

                    <a
                        id="linkInstagram"
                        class="link-rede-social"
                        href="#">

                        <i class="fa-brands fa-instagram"></i>

                    </a>

                    <a
                        id="linkFacebook"
                        class="link-rede-social"
                        href="#">

                        <i class="fa-brands fa-facebook-f"></i>

                    </a>

                    <a
                        id="linkYoutube"
                        class="link-rede-social"
                        href="#">

                        <i class="fa-brands fa-youtube"></i>

                    </a>

                </div>

            </div>

            <!-- ==========================================
                 INSTITUCIONAL
            =========================================== -->

            <div
                id="colunaInstitucional"
                class="coluna-footer">

                <h3
                    id="tituloInstitucional"
                    class="titulo-footer">
                </h3>

                <ul
                    id="listaInstitucional"
                    class="lista-footer">

                    <li><a id="linkSobre" class="link-footer" href="#"></a></li>

                    <li><a id="linkLojas" class="link-footer" href="#"></a></li>

                    <li><a id="linkPrivacidade" class="link-footer" href="#"></a></li>

                    <li><a id="linkTermos" class="link-footer" href="#"></a></li>

                    <li><a id="linkTrabalhe" class="link-footer" href="#"></a></li>

                </ul>

            </div>

            <!-- ==========================================
                 ATENDIMENTO
            =========================================== -->

            <div
                id="colunaAtendimento"
                class="coluna-footer">

                <h3
                    id="tituloAtendimento"
                    class="titulo-footer">
                </h3>

                <ul
                    id="listaAtendimento"
                    class="lista-footer">

                    <li><a id="linkAjuda" class="link-footer" href="#"></a></li>

                    <li><a id="linkPedidos" class="link-footer" href="#"></a></li>

                    <li><a id="linkDevolucao" class="link-footer" href="#"></a></li>

                    <li><a id="linkGarantia" class="link-footer" href="#"></a></li>

                    <li><a id="linkContato" class="link-footer" href="#"></a></li>

                </ul>

            </div>

            <!-- ==========================================
                 NEWSLETTER
            =========================================== -->

            <div
                id="colunaNewsletter"
                class="coluna-footer">

                <h3
                    id="tituloNewsletter"
                    class="titulo-footer">
                </h3>

                <p
                    id="descricaoNewsletter"
                    class="descricao-newsletter">
                </p>

                <div
                    id="formNewsletter"
                    class="form-newsletter">

                    <input
                        id="inputNewsletter"
                        class="input-newsletter"
                        type="email"
                        placeholder="">

                    <button
                        id="botaoNewsletter"
                        class="botao-newsletter">

                        <i class="fa-solid fa-paper-plane"></i>

                    </button>

                </div>

            </div>

        </div>

        <!-- ==========================================
             COPYRIGHT
        =========================================== -->

        <div
            id="rodapeFooter"
            class="rodape-footer">

            <span
                id="textoCopyright"
                class="texto-copyright">
            </span>

            <span
                id="textoCnpj"
                class="texto-cnpj">
            </span>

            <span
                id="textoEmpresa"
                class="texto-empresa">
            </span>

        </div>

    </footer>

    <!-- JavaScript -->

    <script src="../js/home.js"></script>

</body>

</html>
