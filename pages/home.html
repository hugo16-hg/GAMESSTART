<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>GamesStart</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="../assets/">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- ================================================= -->
    <!-- HEADER -->
    <!-- ================================================= -->

    <header
        class="header"
        id="header">

        <div class="container">

            <div
                class="header-content"
                id="headerContent">

                <!-- Logo -->

                <div
                    class="header-logo"
                    id="headerLogo">

                </div>

                <!-- Pesquisa -->

                <div
                    class="header-search"
                    id="headerSearch">

                    <input
                        class="search-input"
                        id="searchInput"
                        type="text"
                        placeholder="O que você está procurando hoje?">

                    <button
                        class="search-button"
                        id="searchButton">

                    </button>

                </div>

                <!-- Ações -->

                <div
                    class="header-actions"
                    id="headerActions">

                    <button
                        class="header-button"
                        id="cartButton">

                    </button>

                    <button
                        class="header-button"
                        id="settingsButton">

                    </button>

                    <button
                        class="header-button"
                        id="profileButton">

                    </button>

                </div>

            </div>

        </div>

    </header>





    <!-- ================================================= -->
    <!-- MENU -->
    <!-- ================================================= -->

    <nav
        class="navbar"
        id="navbar">

        <div class="container">

            <ul
                class="menu"
                id="menu">

            </ul>

        </div>

    </nav>





    <!-- ================================================= -->
    <!-- MAIN -->
    <!-- ================================================= -->

    <main
        class="main"
        id="main">




        <!-- ================================================= -->
        <!-- HERO -->
        <!-- ================================================= -->

        <section
            class="hero"
            id="hero">

            <div class="container">

                <div
                    class="hero-banner"
                    id="heroBanner">

                </div>

            </div>

        </section>





        <!-- ================================================= -->
        <!-- BENEFÍCIOS -->
        <!-- ================================================= -->

        <section
            class="benefits"
            id="benefits">

            <div class="container">

                <div
                    class="benefits-grid"
                    id="benefitsGrid">

                </div>

            </div>

        </section>





        <!-- ================================================= -->
        <!-- CATEGORIAS -->
        <!-- ================================================= -->

        <section
            class="categories"
            id="categories">

            <div class="container">

                <!-- Cabeçalho -->

                <div
                    class="section-header"
                    id="categoriesHeader">

                    <h2
                        class="section-title"
                        id="categoriesTitle">

                    </h2>

                    <a
                        href="#"
                        class="section-link"
                        id="categoriesLink">

                    </a>

                </div>

                <!-- Cards -->

                <div
                    class="categories-grid"
                    id="categoriesGrid">

                </div>

            </div>

        </section>





        <!-- ================================================= -->
        <!-- BANNER PROMOCIONAL -->
        <!-- ================================================= -->

        <section
            class="offer"
            id="offer">

            <div class="container">

                <div
                    class="offer-banner"
                    id="offerBanner">

                </div>

            </div>

        </section>





        <!-- ================================================= -->
        <!-- MAIS VENDIDOS -->
        <!-- ================================================= -->

        <section
            class="products"
            id="bestSellers">

            <div class="container">

                <div
                    class="section-header"
                    id="bestHeader">

                    <h2
                        class="section-title"
                        id="bestTitle">

                    </h2>

                </div>

                <div
                    class="products-grid"
                    id="bestGrid">

                </div>

            </div>

        </section>
                <!-- ================================================= -->
        <!-- NOVIDADES -->
        <!-- ================================================= -->

        <section
            class="products"
            id="newProducts">

            <div class="container">

                <div
                    class="section-header"
                    id="newHeader">

                    <h2
                        class="section-title"
                        id="newTitle">

                    </h2>

                    <p
                        class="section-subtitle"
                        id="newSubtitle">

                    </p>

                </div>

                <div
                    class="products-grid"
                    id="newGrid">

                </div>

            </div>

        </section>





        <!-- ================================================= -->
        <!-- NEWSLETTER -->
        <!-- ================================================= -->

        <section
            class="newsletter"
            id="newsletter">

            <div class="container">

                <div
                    class="newsletter-content"
                    id="newsletterContent">

                    <div
                        class="newsletter-info"
                        id="newsletterInfo">

                    </div>

                    <div
                        class="newsletter-form"
                        id="newsletterForm">

                        <input
                            class="newsletter-input"
                            id="newsletterInput"
                            type="email"
                            placeholder="Seu e-mail">

                        <button
                            class="newsletter-button"
                            id="newsletterButton">

                        </button>

                    </div>

                </div>

            </div>

        </section>

    </main>





    <!-- ================================================= -->
    <!-- FOOTER -->
    <!-- ================================================= -->

    <footer
        class="footer"
        id="footer">

        <div class="container">

            <div
                class="footer-content"
                id="footerContent">

                <!-- Logo / Descrição -->

                <div
                    class="footer-column"
                    id="footerAbout">

                </div>

                <!-- Institucional -->

                <div
                    class="footer-column"
                    id="footerInstitutional">

                </div>

                <!-- Atendimento -->

                <div
                    class="footer-column"
                    id="footerSupport">

                </div>

                <!-- Newsletter / Redes -->

                <div
                    class="footer-column"
                    id="footerContact">

                </div>

            </div>

        </div>





        <!-- Rodapé Inferior -->

        <div
            class="footer-bottom"
            id="footerBottom">

            <div class="container">

                <div
                    class="footer-bottom-content"
                    id="footerBottomContent">

                    <div
                        class="footer-copy"
                        id="footerCopy">

                    </div>

                    <div
                        class="footer-company"
                        id="footerCompany">

                    </div>

                </div>

            </div>

        </div>

    </footer>





    <!-- ================================================= -->
    <!-- MODAL -->
    <!-- ================================================= -->

     <div
                       class="modal"
                         id="modal">

                         <div
                              class="modal-overlay"
                                  id="modalOverlay">

                        </div>

                     <div
                         class="modal-content"
                             id="modalContent">

                     </div>

    </div>





    <!-- ================================================= -->
    <!-- LOADING -->
    <!-- ================================================= -->

                 <div
                          class="loading"
                          id="loading">

                 </div>





    <!-- ================================================= -->
    <!-- TOAST -->
    <!-- ================================================= -->

                <div
                      class="toast"
                      id="toast">

                 </div>





    <!-- ================================================= -->
    <!-- BOTÃO VOLTAR AO TOPO -->
    <!-- ================================================= -->

                     <button
                        class="back-top"
                             id="backTop">

                    </button>





    <!-- ================================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================================= -->

                     <script src="../js/home.js"></script>

            </body>

            </html>
